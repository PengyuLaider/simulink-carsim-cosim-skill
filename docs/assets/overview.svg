<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Simulink 与 CarSim 的 AI 协作工作流 Skill</title>
  <desc id="desc">从澄清契约、生成可读 SLX、真实 CarSim 接入，到分层调试、同版本回归和迁移交付。以实际运行和可追溯证据支撑结论。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#c9d8cd" opacity=".45"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#668d78" stroke-width="1.5"/></marker>
    <style>text{font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif}.ink{fill:#172c29}.muted{fill:#536864}.green{fill:#076d58}.tiny{font-size:14px}.body{font-size:20px}.label{font-size:17px;font-weight:650}.step{font-size:22px;font-weight:700}</style>
  </defs>
  <rect width="1440" height="760" rx="24" fill="#f5f7f3"/>
  <rect x="862" y="28" width="540" height="275" fill="url(#grid)"/>
  <rect x="64" y="54" width="38" height="38" rx="10" fill="#076d58"/>
  <path d="M73 66h9v7h-9zM86 76h8v7h-8zM82 69.5h8V76M77.5 73v11H86" fill="none" stroke="#e8f6ec" stroke-width="1.7"/>
  <text x="118" y="80" class="label ink" letter-spacing="1">SIMULINK × CARSIM / SKILL</text>
  <text x="64" y="168" class="ink" font-size="51" font-weight="760" letter-spacing="-1.4">让 AI 建立模型，</text>
  <text x="64" y="232" class="ink" font-size="51" font-weight="760" letter-spacing="-1.4">让<tspan class="green">验证</tspan>支撑结论。</text>
  <text x="66" y="279" class="body muted">从需求澄清到迁移交付，把一次次调试变成可复用方法。</text>
  <rect x="919" y="75" width="457" height="187" rx="16" fill="#fff" stroke="#cddbd1"/>
  <text x="943" y="106" class="tiny muted" letter-spacing="1">THE ENGINEERING LOOP</text>
  <rect x="943" y="130" width="155" height="58" rx="8" fill="#e2f0e6" stroke="#b9d7c5"/>
  <text x="1020.5" y="155" text-anchor="middle" class="label green">Simulink</text><text x="1020.5" y="175" text-anchor="middle" class="tiny muted">算法与控制</text>
  <rect x="1197" y="130" width="155" height="58" rx="8" fill="#172c29"/>
  <text x="1274.5" y="155" text-anchor="middle" fill="#f0f7ee" font-size="17" font-weight="650">CarSim</text><text x="1274.5" y="175" text-anchor="middle" fill="#bbd1c2" font-size="14">原生车辆求解</text>
  <path d="M1098 145h91M1197 177h-91" stroke="#668d78" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="943" y="232" class="tiny muted">真实反馈 · 原始日志 · 成功与失败都保留</text>
  <path d="M64 327h1312" stroke="#ccd9ce"/>
  <text x="64" y="365" class="tiny green" font-weight="700" letter-spacing="2">SIX PHASES / 六阶段工程工作流</text>
  <path d="M132 455h1114" fill="none" stroke="#a9c2b1" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(64 405)">
    <rect width="201" height="166" rx="13" fill="#fff" stroke="#cddbd1"/><circle cx="30" cy="31" r="14" fill="#e2f0e6"/><text x="30" y="36" text-anchor="middle" class="tiny green" font-weight="700">01</text>
    <text x="20" y="80" class="step ink">澄清契约</text><text x="20" y="113" class="tiny muted">需求 / 环境 / 接口</text><text x="20" y="138" class="tiny muted">先约定如何验收</text>
  </g>
  <g transform="translate(286 405)">
    <rect width="201" height="166" rx="13" fill="#fff" stroke="#cddbd1"/><circle cx="30" cy="31" r="14" fill="#e2f0e6"/><text x="30" y="36" text-anchor="middle" class="tiny green" font-weight="700">02</text>
    <text x="20" y="80" class="step ink">生成可读 SLX</text><text x="20" y="113" class="tiny muted">清晰结构 / 可复建</text><text x="20" y="138" class="tiny muted">让工程师能够接手</text>
  </g>
  <g transform="translate(508 405)">
    <rect width="201" height="166" rx="13" fill="#fff" stroke="#cddbd1"/><circle cx="30" cy="31" r="14" fill="#e2f0e6"/><text x="30" y="36" text-anchor="middle" class="tiny green" font-weight="700">03</text>
    <text x="20" y="80" class="step ink">真实 CarSim</text><text x="20" y="113" class="tiny muted">接入 / 通道 / 响应</text><text x="20" y="138" class="tiny muted">核验原生闭环</text>
  </g>
  <g transform="translate(730 405)">
    <rect width="201" height="166" rx="13" fill="#fff" stroke="#cddbd1"/><circle cx="30" cy="31" r="14" fill="#e2f0e6"/><text x="30" y="36" text-anchor="middle" class="tiny green" font-weight="700">04</text>
    <text x="20" y="80" class="step ink">分层调试</text><text x="20" y="113" class="tiny muted">环境 → 接口 → 控制</text><text x="20" y="138" class="tiny muted">保留最小失败复现</text>
  </g>
  <g transform="translate(952 405)">
    <rect width="201" height="166" rx="13" fill="#fff" stroke="#cddbd1"/><circle cx="30" cy="31" r="14" fill="#e2f0e6"/><text x="30" y="36" text-anchor="middle" class="tiny green" font-weight="700">05</text>
    <text x="20" y="80" class="step ink">同版本回归</text><text x="20" y="113" class="tiny muted">固定案例 / 统一判据</text><text x="20" y="138" class="tiny muted">一版源码一份结论</text>
  </g>
  <g transform="translate(1174 405)">
    <rect width="201" height="166" rx="13" fill="#fff" stroke="#cddbd1"/><circle cx="30" cy="31" r="14" fill="#e2f0e6"/><text x="30" y="36" text-anchor="middle" class="tiny green" font-weight="700">06</text>
    <text x="20" y="80" class="step ink">迁移交付</text><text x="20" y="113" class="tiny muted">依赖 / 清单 / 回滚</text><text x="20" y="138" class="tiny muted">隔离目录重新验证</text>
  </g>
  <rect x="64" y="610" width="1312" height="67" rx="10" fill="#e4eee3"/>
  <text x="87" y="638" class="label green">能力边界</text><text x="192" y="638" class="tiny ink">AI 工作流规范，不含求解器、车型数据库或生产 SLX。</text>
  <text x="192" y="661" class="tiny muted">辅助工具检查通过 ≠ CarSim 闭环通过；仿真结论 ≠ 实车验证结论。</text>
  <text x="64" y="721" class="tiny muted">可复用 · 可审查 · 可追溯</text>
  <text x="1376" y="721" text-anchor="end" class="tiny muted">PengyuLaider / AI-assisted engineering</text>
</svg>
